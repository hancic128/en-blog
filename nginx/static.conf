# en-blog 容器内 nginx 站点配置（覆盖 nginx 自带的 default.conf）
# 构建时由 Dockerfile COPY 进镜像 /etc/nginx/conf.d/default.conf ——
# 配置与镜像 tag 强绑定，主机上不再挂载任何配置文件。
# TLS 由外层 hancic-nginx 终结，本容器只服务静态内容。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 部署探活端点：与内容无关，nginx 起来就 200
    # 被两处使用：app-deploy 的宿主 healthcheck.sh、CI 的冒烟测试
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # 压缩
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 1024;

    # 哈希命名的静态资源长缓存（Hugo 输出 assets 带内容哈希）
    location ~* \.(css|js|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 页面 HTML 短缓存
    location ~* \.html$ {
        expires 5m;
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # 安全头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
