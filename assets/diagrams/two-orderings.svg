<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-label="Two orderings, two failure modes">
  <title>Two orderings, two failure modes</title>
  <g stroke-linejoin="round">
  <text x="20" y="24" font-size="12" fill="currentColor" fill-opacity="0.9" font-weight="600">WRITE FIRST</text>

  <rect x="24" y="40" width="100" height="40" rx="6" fill="none" stroke="currentColor" stroke-opacity="0.42" stroke-width="1.5"/>
  <text x="74" y="64" font-size="11" fill="currentColor" fill-opacity="0.9" text-anchor="middle" font-weight="600">WRITE</text>

  <line x1="124" y1="60" x2="180" y2="60" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5"/>
  <path d="M175,56 L185,60 L175,64 Z" fill="currentColor" fill-opacity="0.6"/>

  <rect x="186" y="40" width="100" height="40" rx="6" fill="#d97706" fill-opacity="0.06" stroke="#d97706" stroke-opacity="0.55" stroke-width="2"/>
  <text x="236" y="64" font-size="11" fill="currentColor" fill-opacity="0.6" text-anchor="middle">crash</text>

  <line x1="286" y1="60" x2="342" y2="60" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5"/>
  <path d="M337,56 L347,60 L337,64 Z" fill="currentColor" fill-opacity="0.6"/>

  <rect x="348" y="40" width="100" height="40" rx="6" fill="none" stroke="currentColor" stroke-opacity="0.42" stroke-width="1.5"/>
  <text x="398" y="60" font-size="11" fill="currentColor" fill-opacity="0.55" text-anchor="middle">key missing</text>
  <text x="398" y="74" font-size="11" fill="currentColor" fill-opacity="0.55" text-anchor="middle">redelivery</text>

  <line x1="448" y1="60" x2="504" y2="60" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5"/>
  <path d="M499,56 L509,60 L499,64 Z" fill="currentColor" fill-opacity="0.6"/>

  <rect x="510" y="40" width="130" height="40" rx="6" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-opacity="0.55" stroke-width="1.2"/>
  <text x="575" y="60" font-size="11" fill="currentColor" fill-opacity="0.9" text-anchor="middle" font-weight="600">DOUBLE-COUNT</text>
  <text x="575" y="74" font-size="10" fill="currentColor" fill-opacity="0.55" text-anchor="middle">can see, can measure</text>

  <line x1="24" y1="110" x2="696" y2="110" stroke="currentColor" stroke-opacity="0.15" stroke-width="1"/>

  <text x="20" y="134" font-size="12" fill="currentColor" fill-opacity="0.9" font-weight="600">SET KEY FIRST</text>

  <rect x="24" y="150" width="100" height="40" rx="6" fill="none" stroke="currentColor" stroke-opacity="0.42" stroke-width="1.5"/>
  <text x="74" y="174" font-size="11" fill="currentColor" fill-opacity="0.9" text-anchor="middle" font-weight="600">SET KEY</text>

  <line x1="124" y1="170" x2="180" y2="170" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5"/>
  <path d="M175,166 L185,170 L175,174 Z" fill="currentColor" fill-opacity="0.6"/>

  <rect x="186" y="150" width="100" height="40" rx="6" fill="#d97706" fill-opacity="0.06" stroke="#d97706" stroke-opacity="0.55" stroke-width="2"/>
  <text x="236" y="174" font-size="11" fill="currentColor" fill-opacity="0.6" text-anchor="middle">crash</text>

  <line x1="286" y1="170" x2="342" y2="170" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5"/>
  <path d="M337,166 L347,170 L337,174 Z" fill="currentColor" fill-opacity="0.6"/>

  <rect x="348" y="150" width="100" height="40" rx="6" fill="none" stroke="currentColor" stroke-opacity="0.42" stroke-width="1.5"/>
  <text x="398" y="170" font-size="11" fill="currentColor" fill-opacity="0.55" text-anchor="middle">count missing</text>
  <text x="398" y="184" font-size="11" fill="currentColor" fill-opacity="0.55" text-anchor="middle">redelivery skips</text>

  <line x1="448" y1="170" x2="504" y2="170" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5"/>
  <path d="M499,166 L509,170 L499,174 Z" fill="currentColor" fill-opacity="0.6"/>

  <rect x="510" y="150" width="130" height="40" rx="6" fill="none" stroke="currentColor" stroke-opacity="0.42" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="575" y="170" font-size="11" fill="currentColor" fill-opacity="0.9" text-anchor="middle" font-weight="600">DATA LOSS</text>
  <text x="575" y="184" font-size="10" fill="currentColor" fill-opacity="0.55" text-anchor="middle">no signal, no alert</text>

  <text x="360" y="230" font-size="11" fill="currentColor" fill-opacity="0.55" text-anchor="middle">I picked the one I can see</text>
  </g>
</svg>
