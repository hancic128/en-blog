<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-label="TTL cache flow from write to read to expiry">
  <title>TTL cache flow from write to read to expiry</title>
  <g stroke-linejoin="round">
  <line x1="80" y1="40" x2="80" y2="220" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.5"/>
  <text x="80" y="32" font-size="13" fill="currentColor" fill-opacity="0.9" text-anchor="middle" font-weight="600">WRITE</text>

  <line x1="320" y1="40" x2="320" y2="220" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.5"/>
  <text x="320" y="32" font-size="13" fill="currentColor" fill-opacity="0.9" text-anchor="middle" font-weight="600">CACHE</text>

  <line x1="560" y1="40" x2="560" y2="220" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.5"/>
  <text x="560" y="32" font-size="13" fill="currentColor" fill-opacity="0.9" text-anchor="middle" font-weight="600">READ</text>

  <rect x="36" y="64" width="88" height="22" rx="4" fill="none" stroke="currentColor" stroke-opacity="0.42" stroke-width="1.2"/>
  <text x="80" y="79" font-size="11" fill="currentColor" fill-opacity="0.85" text-anchor="middle">db commit</text>
  <line x1="124" y1="75" x2="288" y2="75" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5"/>
  <path d="M279,71 L289,75 L279,79 Z" fill="currentColor" fill-opacity="0.6"/>
  <text x="206" y="69" font-size="11" fill="currentColor" fill-opacity="0.55" text-anchor="middle">write + TTL</text>

  <rect x="276" y="108" width="88" height="22" rx="4" fill="none" stroke="currentColor" stroke-opacity="0.42" stroke-width="1.2"/>
  <text x="320" y="123" font-size="11" fill="currentColor" fill-opacity="0.85" text-anchor="middle">stored, ticking</text>

  <line x1="352" y1="155" x2="552" y2="155" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5"/>
  <path d="M543,151 L553,155 L543,159 Z" fill="currentColor" fill-opacity="0.6"/>
  <text x="452" y="149" font-size="11" fill="currentColor" fill-opacity="0.55" text-anchor="middle">hit before TTL</text>

  <rect x="516" y="180" width="88" height="22" rx="4" fill="none" stroke="currentColor" stroke-opacity="0.42" stroke-width="1.2"/>
  <text x="560" y="195" font-size="11" fill="currentColor" fill-opacity="0.85" text-anchor="middle">served stale</text>

  <path d="M80,150 Q200,210 320,210" fill="none" stroke="#d97706" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="5 3"/>
  <path d="M312,206 L320,210 L318,202 Z" fill="#d97706" fill-opacity="0.55"/>
  <text x="170" y="206" font-size="11" fill="#d97706" fill-opacity="0.85" text-anchor="middle">db changed</text>

  <path d="M320,140 Q440,90 560,118" fill="none" stroke="#d97706" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="5 3"/>
  <path d="M553,114 L560,118 L551,121 Z" fill="#d97706" fill-opacity="0.55"/>
  <text x="450" y="92" font-size="11" fill="#d97706" fill-opacity="0.85" text-anchor="middle">cache still V1</text>
  </g>
</svg>
