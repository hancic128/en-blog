<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-label="Write-through partial success: cache and database fall out of sync">
  <title>Write-through partial success: cache and database fall out of sync</title>
  <g stroke-linejoin="round">
  <line x1="80" y1="40" x2="80" y2="220" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.5"/>
  <text x="80" y="32" font-size="13" fill="currentColor" fill-opacity="0.9" text-anchor="middle" font-weight="600">CLIENT</text>

  <line x1="320" y1="40" x2="320" y2="220" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.5"/>
  <text x="320" y="32" font-size="13" fill="currentColor" fill-opacity="0.9" text-anchor="middle" font-weight="600">CACHE</text>

  <line x1="600" y1="40" x2="600" y2="220" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.5"/>
  <text x="600" y="32" font-size="13" fill="currentColor" fill-opacity="0.9" text-anchor="middle" font-weight="600">DATABASE</text>

  <line x1="80" y1="76" x2="296" y2="76" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5"/>
  <path d="M287,72 L297,76 L287,80 Z" fill="currentColor" fill-opacity="0.6"/>
  <text x="188" y="70" font-size="11" fill="currentColor" fill-opacity="0.55" text-anchor="middle">set V2</text>

  <line x1="344" y1="76" x2="576" y2="76" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5"/>
  <path d="M567,72 L577,76 L567,80 Z" fill="currentColor" fill-opacity="0.6"/>
  <text x="460" y="70" font-size="11" fill="currentColor" fill-opacity="0.55" text-anchor="middle">write V2</text>

  <rect x="276" y="112" width="88" height="22" rx="4" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-opacity="0.55" stroke-width="1.2"/>
  <text x="320" y="127" font-size="11" fill="currentColor" fill-opacity="0.85" text-anchor="middle" font-weight="600">cache = V2</text>

  <rect x="556" y="148" width="88" height="22" rx="4" fill="none" stroke="#d97706" stroke-opacity="0.55" stroke-width="1.2"/>
  <text x="600" y="163" font-size="11" fill="#d97706" fill-opacity="0.85" text-anchor="middle">rolled back</text>

  <line x1="600" y1="170" x2="320" y2="140" stroke="#d97706" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="4 3"/>
  <path d="M328,142 L320,140 L327,134 Z" fill="#d97706" fill-opacity="0.55"/>
  <text x="460" y="180" font-size="11" fill="#d97706" fill-opacity="0.85" text-anchor="middle">cache holds a phantom</text>

  <rect x="36" y="200" width="88" height="22" rx="4" fill="none" stroke="currentColor" stroke-opacity="0.42" stroke-width="1.2"/>
  <text x="80" y="215" font-size="11" fill="currentColor" fill-opacity="0.85" text-anchor="middle">next read</text>

  <line x1="124" y1="211" x2="288" y2="211" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5"/>
  <path d="M279,207 L289,211 L279,215 Z" fill="currentColor" fill-opacity="0.6"/>
  <text x="206" y="205" font-size="11" fill="currentColor" fill-opacity="0.55" text-anchor="middle">gets V2 (wrong)</text>
  </g>
