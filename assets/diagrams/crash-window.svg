<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-label="The crash window between write count and set key">
  <title>The crash window between write count and set key</title>
  <g stroke-linejoin="round">
  <rect x="24" y="36" width="150" height="52" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.42" stroke-width="1.5"/>
  <text x="99" y="60" font-size="13" fill="currentColor" fill-opacity="0.9" text-anchor="middle" font-weight="600">WRITE COUNT</text>
  <text x="99" y="78" font-size="11" fill="currentColor" fill-opacity="0.55" text-anchor="middle">cache updated</text>

  <line x1="174" y1="62" x2="246" y2="62" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5"/>
  <path d="M241,58 L251,62 L241,66 Z" fill="currentColor" fill-opacity="0.6"/>

  <rect x="252" y="30" width="168" height="64" rx="8" fill="#d97706" fill-opacity="0.06" stroke="#d97706" stroke-opacity="0.55" stroke-width="2"/>
  <text x="336" y="56" font-size="13" fill="#d97706" fill-opacity="0.9" text-anchor="middle" font-weight="600">CRASH WINDOW</text>
  <text x="336" y="76" font-size="11" fill="currentColor" fill-opacity="0.55" text-anchor="middle">few ms, cannot close</text>

  <line x1="420" y1="62" x2="492" y2="62" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.5"/>
  <path d="M487,58 L497,62 L487,66 Z" fill="currentColor" fill-opacity="0.6"/>

  <rect x="498" y="36" width="150" height="52" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.42" stroke-width="1.5"/>
  <text x="573" y="60" font-size="13" fill="currentColor" fill-opacity="0.9" text-anchor="middle" font-weight="600">SET KEY</text>
  <text x="573" y="78" font-size="11" fill="currentColor" fill-opacity="0.55" text-anchor="middle">TTL 10 min</text>

  <line x1="336" y1="94" x2="336" y2="120" stroke="#d97706" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="4 3"/>
  <path d="M332,116 L336,126 L340,116 Z" fill="#d97706" fill-opacity="0.55"/>

  <text x="336" y="146" font-size="11" fill="currentColor" fill-opacity="0.6" text-anchor="middle">crash here</text>
  <text x="336" y="166" font-size="11" fill="currentColor" fill-opacity="0.55" text-anchor="middle">→ key missing → double-count</text>
  </g>
</svg>
