name: Deploy

# en-blog CI/CD（2026-09-19 建）：
#   本仓库是公开仓库，只做两件事 —— 把站点构进镜像推 ghcr、发 repository_dispatch 通知
#   私有仓库 app-deploy。镜像搬运（ghcr -> 阿里云 ACR）与 SSH 部署都在 app-deploy 完成，
#   所以本仓库零 registry 凭证、零 SSH key，主机信息不可能漏进公开历史。
#
# 触发：只允许 v* tag（额度纪律：禁止 push branches / pull_request 自动跑）。
# 回滚：不重跑本 workflow，到 app-deploy 的 Actions 用旧 tag 手动 Run workflow。
#
# secrets：APP_DEPLOY_DISPATCH_TOKEN（fine-grained PAT，Contents: Read and write，
#          只授权 hancic128/app-deploy）。推 ghcr 用自带的 GITHUB_TOKEN。

on:
  push:
    tags: ['v*']

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # 推镜像到 ghcr 需要 packages: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: ghcr.io/hancic128/en-blog:${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 先只 build 到本地：冒烟过了再 push，避免"镜像已上 ghcr 但打不开"的半成品
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test（真起容器，按生产方式访问）
        run: |
          set -euo pipefail
          docker run -d --name en-blog-smoke -p 8080:80 "$IMAGE"
          trap 'docker logs en-blog-smoke || true; docker rm -f en-blog-smoke' EXIT

          # 1. /healthz：nginx 起来了（镜像内 static.conf 提供，与内容无关）
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:8080/healthz || true)
            [ "$code" = "200" ] && break
            if [ "$i" = "20" ]; then echo "::error::/healthz 未就绪（$code）"; exit 1; fi
            sleep 1
          done
          echo "GET /healthz -> 200"

          # 2. 站点产物确实在镜像里（路径都是 Hugo 必出的稳定页，不依赖具体文章）
          for p in / /about/ /archives/ /posts/ /tags/ /index.xml /sitemap.xml /robots.txt /404.html; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "http://127.0.0.1:8080${p}")
            [ "$code" = "200" ] || { echo "::error::GET ${p} 期望 200，实际 ${code}"; exit 1; }
            echo "GET ${p} -> 200"
          done

          # 3. 首页是本站内容，不是 nginx 自带的示例页
          curl -fsS http://127.0.0.1:8080/ | grep -q 'Hancic Tech Blog' \
            || { echo "::error::首页不是本站内容（可能 COPY 没生效）"; exit 1; }

          # 4. 容器内配置就是仓库里那份
          docker exec en-blog-smoke grep -q 'healthz' /etc/nginx/conf.d/default.conf \
            || { echo "::error::容器内 nginx 配置不是仓库里的 static.conf"; exit 1; }

      - name: Push to ghcr
        run: docker push "$IMAGE"

      - name: Trigger app-deploy
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.APP_DEPLOY_DISPATCH_TOKEN }}
          repository: hancic128/app-deploy
          event-type: deploy
          client-payload: '{"app":"en-blog","tag":"${{ github.ref_name }}"}'
